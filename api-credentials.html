<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Credentials | API Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: var(--primary-bg); border-radius: var(--radius-lg); width: 100%; max-width: 500px; padding: 2rem; box-shadow: var(--shadow-xl); transform: translateY(20px); transition: transform 0.3s; }
        .modal-overlay.active .modal-card { transform: translateY(0); }
    </style>
    <script src="https://unpkg.com/@phosphor-icons/web"></script></head>
<body>
    <div class="dashboard-wrapper">
        <div id="sidebar-container"></div>
        
        <div class="main-panel">
            <div id="topbar-container"></div>
            
            <div class="content-area">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 style="font-size: 1.5rem; margin-bottom: 0.25rem;">API Keys</h2>
                        <p class="text-muted m-0">Manage your secret keys for API authentication.</p>
                    </div>
                    <button class="btn btn-primary" onclick="document.getElementById('create-modal').classList.add('active')">+ Generate New Key</button>
                </div>
                
                <div class="mb-6">
                    <div style="background-color: var(--accent-light); border-left: 4px solid var(--accent-blue); padding: 1rem; border-radius: var(--radius-sm);">
                        <h4 style="color: var(--accent-blue); margin-bottom: 0.5rem; font-family: var(--font-body); font-size: 0.9375rem;">Security Warning</h4>
                        <p class="text-sm m-0" style="color: #1e3a8a; font-size: 0.875rem;">Never share your secret keys or commit them to public repositories. Anyone with your secret key can make API requests on your behalf.</p>
                    </div>
                </div>
                
                <div id="credentials-container">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Create Key Modal -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal-card">
            <h3 class="mb-4">Generate API Key</h3>
            <form id="generate-key-form">
                <div class="form-group mb-4">
                    <label class="form-label">Key Name</label>
                    <input type="text" class="form-control" id="key-name" required placeholder="e.g. Production Backend">
                </div>
                <div class="form-group mb-6">
                    <label class="form-label">Environment</label>
                    <select class="form-control" id="key-env" required>
                        <option value="Live">Live (Production)</option>
                        <option value="Test">Test (Sandbox)</option>
                    </select>
                </div>
                <div class="flex justify-end gap-4">
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('create-modal').classList.remove('active')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Generate Key</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initDashboard('credentials', 'API Credentials');
            
            const renderKeys = () => {
                const keys = getApiKeys();
                const container = document.getElementById('credentials-container');
                
                if (keys.length === 0) {
                    container.innerHTML = `
                        <div class="card card-body text-center" style="padding: 4rem 2rem;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">🔑</div>
                            <h3 class="mb-2">No API Keys Generated</h3>
                            <p class="text-muted mb-6">Generate your first API key to start making requests.</p>
                            <button class="btn btn-primary" onclick="document.getElementById('create-modal').classList.add('active')">Generate New Key</button>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                keys.reverse().forEach(key => {
                    const badgeClass = key.environment === 'Live' ? 'badge-blue' : '';
                    const badgeStyle = key.environment === 'Test' ? 'background: #fef3c7; color: #92400e;' : '';
                    
                    html += `
                    <div class="card mb-6">
                        <div class="card-header flex justify-between items-center">
                            <h3 class="m-0" style="font-size: 1.25rem;">${key.name}</h3>
                            <span class="badge ${badgeClass}" style="${badgeStyle}">${key.environment} Mode</span>
                        </div>
                        <div class="card-body">
                            <div class="form-group mb-6">
                                <label class="form-label">Publishable Key</label>
                                <div class="flex gap-2">
                                    <input type="text" class="form-control" value="${key.publishable}" readonly style="background-color: var(--secondary-bg); font-family: monospace; font-size: 0.875rem;">
                                    <button class="btn btn-outline" onclick="copyToClipboard('${key.publishable}')">Copy</button>
                                </div>
                            </div>
                            <div class="form-group mb-0">
                                <label class="form-label">Secret Key</label>
                                <div class="flex gap-2">
                                    <input type="password" id="secret-${key.id}" class="form-control" value="${key.secret}" readonly style="background-color: var(--secondary-bg); font-family: monospace; font-size: 0.875rem;">
                                    <button class="btn btn-outline" id="toggle-${key.id}" onclick="toggleSecret('${key.id}')">Show</button>
                                    <button class="btn btn-outline" onclick="copyToClipboard('${key.secret}')">Copy</button>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer flex justify-between items-center" style="padding: 1rem 2rem;">
                            <span class="text-muted" style="font-size: 0.875rem;">Created: ${new Date(key.createdAt).toLocaleDateString()}</span>
                            <button class="btn btn-secondary text-danger" style="color: var(--danger); padding: 0.5rem 1rem;" onclick="handleDelete('${key.id}')">Revoke Key</button>
                        </div>
                    </div>
                    `;
                });
                container.innerHTML = html;
            };

            renderKeys();
            
            document.getElementById('generate-key-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('key-name').value;
                const env = document.getElementById('key-env').value;
                createApiKey(name, env);
                document.getElementById('create-modal').classList.remove('active');
                e.target.reset();
                showToast('API Key generated successfully');
                renderKeys();
            });
            
            window.toggleSecret = (id) => {
                const input = document.getElementById('secret-' + id);
                const btn = document.getElementById('toggle-' + id);
                if(input.type === 'password') {
                    input.type = 'text';
                    btn.textContent = 'Hide';
                } else {
                    input.type = 'password';
                    btn.textContent = 'Show';
                }
            };
            
            window.copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Copied to clipboard');
                });
            };
            
            window.handleDelete = (id) => {
                if(confirm('Are you sure you want to revoke this API key? This will immediately break any integrations using it.')) {
                    deleteApiKey(id);
                    showToast('API Key revoked');
                    renderKeys();
                }
            };
        });
    </script>
</body>
</html>
