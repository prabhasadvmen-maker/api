<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | API</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script></head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                API
            </a>
            
            <button class="mobile-menu-btn">☰</button>
            
            <ul class="nav-links">
                <li><a href="marketplace.html" class="nav-link" style="color: var(--text-light)">Marketplace</a></li>
                <li><a href="documentation.html" class="nav-link">Documentation</a></li>
                <li><a href="support.html" class="nav-link">Support</a></li>
            </ul>
            
            <div class="nav-actions">
                <a href="package.html" class="btn btn-outline" style="color: var(--text-light); border-color: rgba(255,255,255,0.3);">
                    Cart <span class="cart-count" style="display: none;">0</span>
                </a>
                <a href="login.html" class="btn btn-primary">Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content container">
        <div class="mb-8">
            <h1 class="mb-2">API Marketplace</h1>
            <p class="text-muted">Browse our comprehensive catalog of verified third-party APIs and managed services.</p>
        </div>
        
        <div class="flex justify-between items-center mb-6" style="background: var(--primary-bg); padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
            <div class="flex gap-4">
                <select id="category-filter" class="form-control" style="width: 200px;">
                    <option value="all">All Categories</option>
                    <option value="Verification">Verification</option>
                    <option value="Communication">Communication</option>
                    <option value="Location">Location</option>
                    <option value="Finance">Finance</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Security">Security</option>
                    <option value="Compliance">Compliance</option>
                </select>
                <input type="text" id="search-input" class="form-control" placeholder="Search APIs..." style="width: 250px;">
            </div>
            <div class="text-muted text-sm">
                Showing <span id="api-count">18</span> services
            </div>
        </div>
        
        <div id="all-apis" class="api-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
            <!-- All APIs will be rendered here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">
            <div>&copy; 2026 API Managed Services. All rights reserved.</div>
            <div class="flex gap-4">
                <a href="#" style="color: var(--text-muted);">Terms</a>
                <a href="#" style="color: var(--text-muted);">Privacy</a>
            </div>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const renderFiltered = () => {
                const term = document.getElementById('search-input').value.toLowerCase();
                const cat = document.getElementById('category-filter').value;
                
                const filtered = apisData.filter(api => {
                    const matchTerm = api.name.toLowerCase().includes(term) || api.description.toLowerCase().includes(term);
                    const matchCat = cat === 'all' || api.category === cat;
                    return matchTerm && matchCat;
                });
                
                renderAPIs('all-apis', filtered);
                document.getElementById('api-count').textContent = filtered.length;
            };

            document.getElementById('search-input').addEventListener('input', renderFiltered);
            document.getElementById('category-filter').addEventListener('change', renderFiltered);
            
            // Initial render
            renderFiltered();
        });
    </script>
</body>
</html>
