<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success | API</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script></head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">API</a>
        </div>
    </nav>

    <main class="main-content container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px);">
        <div class="card text-center" style="max-width: 500px; padding: 4rem 2rem;">
            <div style="width: 80px; height: 80px; background-color: #d1fae5; color: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 2rem;">
                ✓
            </div>
            <h1 class="mb-4">Order Successful!</h1>
            <p class="text-muted mb-2">Your API services have been provisioned.</p>
            <p class="mb-6">Order ID: <strong id="order-id" style="color: var(--accent-blue);">API-0000</strong></p>
            
            <div class="flex justify-center gap-4">
                <a href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>
                <a href="documentation.html" class="btn btn-outline">View Docs</a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const orderNum = localStorage.getItem('lastOrderNumber') || 'API-2026-1048';
            document.getElementById('order-id').textContent = orderNum;
        });
    </script>
</body>
</html>
