<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices | API</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script></head>
<body>
    <div class="dashboard-wrapper">
        <div id="sidebar-container"></div>
        
        <div class="main-panel">
            <div id="topbar-container"></div>
            
            <div class="content-area">
                <div class="card">
                    <div class="card-header flex justify-between items-center">
                        <h3 class="m-0">Invoice History</h3>
                        <button class="btn btn-outline" style="padding: 0.5rem 1rem;">Download All</button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Invoice ID</th>
                                    <th>Date</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="invoice-list">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initDashboard('invoices', 'Invoices');
            
            const tbody = document.getElementById('invoice-list');
            const summaryStr = localStorage.getItem('apiOrderSummary');
            const orderNum = localStorage.getItem('lastOrderNumber');
            
            if (!summaryStr || !orderNum) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted" style="padding: 3rem;">No invoices found.</td></tr>`;
                return;
            }
            
            const summary = JSON.parse(summaryStr);
            const date = new Date().toLocaleDateString('en-IN');
            
            tbody.innerHTML = `
                <tr>
                    <td style="font-weight: 500;">INV-${orderNum}</td>
                    <td>${date}</td>
                    <td>${formatCurrency(summary.total)}</td>
                    <td><span class="status status-active">Paid</span></td>
                    <td>
                        <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="alert('Downloading invoice PDF (Demo)')">Download PDF</button>
                    </td>
                </tr>
            `;
        });
    </script>
</body>
</html>
